services:
  catalog:
    build:
      context: .
    ports:
      - "${CATALOG_BIND:-127.0.0.1}:${CATALOG_PORT:-8787}:8787"
    volumes:
      - ./data:/data:ro
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      CATALOG_DATA_DIR: /data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
