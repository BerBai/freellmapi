name: Branch release artifacts

on:
  workflow_dispatch:
  push:
    branches: [feat/self-hosted-catalog]
    paths:
      - 'cli/**'
      - '.github/workflows/branch-release.yml'

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run build -w cli
          npm run test -w cli

      - name: Pack package
        run: npm pack --pack-destination "$RUNNER_TEMP" -w cli

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llmself-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/llmself-*.tgz
          if-no-files-found: error

  cross-compile:
    name: Bun ${{ matrix.bun-target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bun-target: bun-linux-x64
            platform: linux-x64
          - os: ubuntu-24.04
            bun-target: bun-linux-arm64
            platform: linux-arm64
          - os: macos-15
            bun-target: bun-darwin-x64
            platform: macos-x64
          - os: macos-15
            bun-target: bun-darwin-arm64
            platform: macos-arm64
          - os: windows-2025
            bun-target: bun-windows-x64
            platform: windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve CLI version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./cli/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile standalone CLI
        shell: bash
        env:
          BUN_TARGET: ${{ matrix.bun-target }}
          PLATFORM: ${{ matrix.platform }}
          CLI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUTDIR="$RUNNER_TEMP/dist-bin"
          mkdir -p "$OUTDIR"
          OUTFILE="$OUTDIR/llmself-$CLI_VERSION-$PLATFORM"
          if [ "$PLATFORM" = "windows-x64" ]; then
            OUTFILE="$OUTFILE.exe"
          fi
          bun build --compile --target="$BUN_TARGET" cli/src/index.ts --outfile "$OUTFILE"

      - name: Upload standalone artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llmself-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist-bin/*
          if-no-files-found: error
